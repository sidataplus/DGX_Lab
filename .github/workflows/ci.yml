name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  content-and-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML jsonschema
      - run: python3 scripts/validate_all.py
      - run: python3 scripts/check_forbidden_apis.py
      - run: python3 scripts/static_rust_sanity.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude web-ui --exclude sim-worker-wasm --exclude dgx-lab-desktop --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude web-ui --exclude sim-worker-wasm --exclude dgx-lab-desktop
      - run: cargo build -p sim-worker-wasm --target wasm32-unknown-unknown
      - run: node --check prototype/app.js
  content-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML jsonschema
      - run: python3 scripts/build_course_pack.py
      - uses: actions/upload-artifact@v7
        with:
          name: dgxlab-content-pack
          path: dist/*.dgxlabpack
