name: Release blueprint (manual, unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML jsonschema
      - run: ./scripts/run_static_checks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: |
            MANIFEST.sha256
            dist/*.dgxlabpack
  # Add target-OS Tauri build jobs only after M0 compilation and signing ADRs pass.
