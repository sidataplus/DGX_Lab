schema: dgxlab.lab/v1
id: 04-one-gpu
revision: 1.0.0
title: One GPU Allocation and Isolation
scenario: guided-one-gpu
estimated_minutes: 30
prerequisites:
- 03-cpu-memory
objectives:
- id: 04-one-gpu-objective-1
  competency: gpu-allocation
  description: Inspect idle GPU capacity.
- id: 04-one-gpu-objective-2
  competency: gpu-isolation
  description: Request one H200 GPU, 8 CPUs, and 64 GiB memory.
- id: 04-one-gpu-objective-3
  competency: gpu-isolation
  description: Verify `CUDA_VISIBLE_DEVICES` and `nvidia-smi -L`.
- id: 04-one-gpu-objective-4
  competency: gpu-isolation
  description: Release the allocation.
steps:
- id: inspect
  instruction: Inspect idle GPU capacity
  evidence:
  - Confirm the compute node is available before asking the scheduler for a GPU.
  critical: false
- id: allocate
  instruction: Request one GPU, 8 CPUs, and 64 GiB
  evidence:
  - A learner job should run with exactly one allocated GPU tile.
  critical: false
- id: verify-env
  instruction: Verify the job environment
  evidence:
  - The environment should expose one locally remapped GPU index.
  critical: true
- id: verify-gpu
  instruction: Verify visible GPU hardware
  evidence:
  - Only the allocated simulated GPU should be visible inside the job.
  critical: true
- id: release
  instruction: Release the allocation
  evidence:
  - The job should complete and the GPU tile should return to idle.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
