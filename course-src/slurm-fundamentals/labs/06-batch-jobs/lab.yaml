schema: dgxlab.lab/v1
id: 06-batch-jobs
revision: 1.0.0
title: From Interactive Command to Batch Job
scenario: dgx-h200-8
estimated_minutes: 35
prerequisites:
- 05-containers
objectives:
- id: 06-batch-jobs-objective-1
  competency: batch-jobs
  description: Edit `train.sbatch` with resource directives.
- id: 06-batch-jobs-objective-2
  competency: logs
  description: Validate and submit the script.
- id: 06-batch-jobs-objective-3
  competency: logs
  description: Inspect output and error paths.
- id: 06-batch-jobs-objective-4
  competency: logs
  description: Use `sacct` after completion.
steps:
- id: edit-script
  instruction: Save and preflight the batch script
  evidence:
  - A learner write must save explicit resources, runtime, and output paths; the seeded file alone is not evidence.
  critical: false
- id: submit-batch
  instruction: Submit the batch script
  evidence:
  - Capture the returned job ID and locate it in the queue.
  critical: false
- id: job-progress
  instruction: Advance until the batch job completes
  evidence:
  - Completion must exist in simulator state before the lab can close.
  critical: true
- id: inspect-logs
  instruction: Inspect the generated logs
  evidence:
  - After completion, connect the virtual output file to the submitted job.
  critical: true
- id: accounting
  instruction: Review the completed job in accounting
  evidence:
  - Use terminal state and elapsed time as durable completion evidence.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
