schema: dgxlab.lab/v1
id: 03-cpu-memory
revision: 1.0.0
title: CPU and Memory Requests
scenario: dgx-h200-8
estimated_minutes: 30
prerequisites:
- 02-interactive-cpu
objectives:
- id: 03-cpu-memory-objective-1
  competency: resource-allocation
  description: Submit a CPU preprocessing job.
- id: 03-cpu-memory-objective-2
  competency: cgroup-isolation
  description: Compare requested and observed memory.
- id: 03-cpu-memory-objective-3
  competency: cgroup-isolation
  description: Trigger a simulated host-memory OOM and diagnose it.
steps:
- id: step-0
  instruction: Run a safe CPU preprocessing baseline
  evidence:
  - Capture a baseline request with enough host memory to complete.
  critical: false
- id: step-1
  instruction: Inspect the recorded resource request
  evidence:
  - Compare the recorded CPU and memory request with the intended baseline.
  critical: false
- id: step-2
  instruction: Submit a low-memory comparison job
  evidence:
  - A second learner job should record the intentionally constrained memory request.
  critical: false
- id: step-3
  instruction: Observe and classify the host-memory OOM
  evidence:
  - After time advances, accounting should show an out-of-memory terminal state.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
