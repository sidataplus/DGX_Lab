schema: dgxlab.lab/v1
id: 09-failure-resume
revision: 1.0.0
title: Diagnose Failure and Resume
scenario: dgx-degraded
estimated_minutes: 45
prerequisites:
- 08-arrays-dependencies
objectives:
- id: 09-failure-resume-objective-1
  competency: troubleshooting
  description: Use `sacct` to identify the terminal state.
- id: 09-failure-resume-objective-2
  competency: checkpointing
  description: Read logs and distinguish GPU OOM from host OOM.
- id: 09-failure-resume-objective-3
  competency: checkpointing
  description: Select the newest valid checkpoint.
- id: 09-failure-resume-objective-4
  competency: checkpointing
  description: Resubmit with corrected resources and resume.
steps:
- id: sacct
  instruction: Find the failed job in accounting
  evidence:
  - Identify the terminal state before choosing a remedy.
  critical: false
- id: inspect-logs
  instruction: Inspect logs for the failure signal
  evidence:
  - After the OOM, read stderr to distinguish symptoms from causes.
  critical: false
- id: oom-observed
  instruction: Explain the out-of-memory state
  evidence:
  - Connect the terminal state to a smaller batch size or larger memory request.
  critical: false
- id: checkpoint
  instruction: Locate the newest usable checkpoint
  evidence:
  - Read the newest pre-retry checkpoint before using it as a restart point.
  critical: false
- id: resume-submitted
  instruction: Run a corrected recovery job to completion
  evidence:
  - The completed retry must preserve the partition, 4 GPUs, 16 CPUs, two-hour limit, exact 64 GiB request, and latest readable pre-retry checkpoint.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
