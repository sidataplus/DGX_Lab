schema: dgxlab.lab/v1
id: 05-containers
revision: 1.0.0
title: Reproducible Container Workloads
scenario: dgx-h200-8
estimated_minutes: 35
prerequisites:
- 04-one-gpu
objectives:
- id: 05-containers-objective-1
  competency: containers
  description: Load the simulated Singularity module.
- id: 05-containers-objective-2
  competency: gpu-isolation
  description: Run the PyTorch lab image with `--nv`.
- id: 05-containers-objective-3
  competency: gpu-isolation
  description: Verify that the container sees only the allocated GPU.
- id: 05-containers-objective-4
  competency: gpu-isolation
  description: Diagnose a missing-image error.
steps:
- id: step-0
  instruction: Request an isolated GPU allocation
  evidence:
  - The container exercise should begin inside a scheduler-owned allocation.
  critical: false
- id: step-1
  instruction: Load the container module
  evidence:
  - The terminal should acknowledge the simulated module environment.
  critical: false
- id: step-2
  instruction: Run the synthetic container workload
  evidence:
  - Tie the container command to a scheduler-owned GPU allocation.
  critical: false
- id: step-3
  instruction: Verify allocation-level GPU isolation
  evidence:
  - The active shell should expose only the GPU assigned by the scheduler.
  critical: false
- id: step-4
  instruction: Submit and observe the missing-image failure
  evidence:
  - The separately named `container-missing` job should reach `FAILED` after using `/missing/pytorch-lab.sif`.
  critical: true
- id: step-5
  instruction: Inspect the missing-image job log
  evidence:
  - Inspect stderr after the named failure before choosing a correction.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
