schema: dgxlab.lab/v1
id: 11-policy-efficiency
revision: 1.0.0
title: QOS, Reservations, and Efficiency
scenario: dgx-shared
estimated_minutes: 40
prerequisites:
- 10-multi-gpu
objectives:
- id: 11-policy-efficiency-objective-1
  competency: qos
  description: Interpret a QOS per-user limit.
- id: 11-policy-efficiency-objective-2
  competency: reservations
  description: Inspect a reservation-constrained job.
- id: 11-policy-efficiency-objective-3
  competency: efficiency
  description: Right-size CPU and memory from accounting evidence.
- id: 11-policy-efficiency-objective-4
  competency: efficiency
  description: Explain why using every available GPU is not automatically efficient.
steps:
- id: step-0
  instruction: Inspect shared-cluster queue pressure
  evidence:
  - Find the prepared learner job waiting on the per-user QOS limit.
  critical: false
- id: step-1
  instruction: Inspect the QOS-limited job
  evidence:
  - Connect its typed pending reason to the configured concurrent-job limit.
  critical: false
- id: step-2
  instruction: Review accounting before right-sizing
  evidence:
  - Use completed-job resource and elapsed-time evidence instead of guessing.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
