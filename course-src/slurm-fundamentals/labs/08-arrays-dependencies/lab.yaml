schema: dgxlab.lab/v1
id: 08-arrays-dependencies
revision: 1.0.0
title: Arrays and Dependencies
scenario: dgx-contended
estimated_minutes: 40
prerequisites:
- 07-pending-reasons
objectives:
- id: 08-arrays-dependencies-objective-1
  competency: job-arrays
  description: Submit a four-task parameter sweep.
- id: 08-arrays-dependencies-objective-2
  competency: dependencies
  description: Inspect array element states.
- id: 08-arrays-dependencies-objective-3
  competency: dependencies
  description: Submit an evaluation job with `afterok` dependency.
- id: 08-arrays-dependencies-objective-4
  competency: dependencies
  description: Observe dependency release after the array completes.
steps:
- id: step-0
  instruction: Submit the edited four-task array
  evidence:
  - Look for the expanded learner tasks created from one script.
  critical: false
- id: step-1
  instruction: Inspect task states in the queue
  evidence:
  - Distinguish independently scheduled tasks from the parent submission.
  critical: false
- id: step-2
  instruction: Submit the edited evaluation dependency
  evidence:
  - After replacing the array with an `afterok` dependency, confirm the submitted job retains that prerequisite.
  critical: false
- id: step-3
  instruction: Observe the evaluation dependency release
  evidence:
  - Advance in bounded steps until the named `evaluate` job becomes eligible and starts or completes.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
