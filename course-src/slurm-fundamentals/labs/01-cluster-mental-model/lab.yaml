schema: dgxlab.lab/v1
id: 01-cluster-mental-model
revision: 1.0.0
title: Cluster, Nodes, Partitions, Jobs, and Steps
scenario: dgx-h200-8
estimated_minutes: 25
prerequisites: []
objectives:
- id: 01-cluster-mental-model-objective-1
  competency: cluster-fundamentals
  description: Run `sinfo` and identify the default partition and node state.
- id: 01-cluster-mental-model-objective-2
  competency: cluster-fundamentals
  description: Run `scontrol show node dgx-h200-01` and locate CPU, memory, and GPU
    capacity.
- id: 01-cluster-mental-model-objective-3
  competency: cluster-fundamentals
  description: Explain the distinction between a job allocation and a job step.
steps:
- id: step-0
  instruction: Inspect partitions and node state
  evidence:
  - Find the default partition and distinguish idle from allocated capacity.
  critical: false
- id: step-1
  instruction: Inspect the node's resource capacity
  evidence:
  - Locate total and allocated CPU, memory, and GPU capacity in one node record.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
