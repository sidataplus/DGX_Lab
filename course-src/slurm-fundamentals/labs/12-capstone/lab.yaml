schema: dgxlab.lab/v1
id: 12-capstone
revision: 1.0.0
title: 'Capstone: Robust Training Campaign'
scenario: dgx-contended
estimated_minutes: 60
prerequisites:
- 11-policy-efficiency
objectives:
- id: 12-capstone-objective-1
  competency: batch-jobs
  description: Turn an interactive prototype into a batch script.
- id: 12-capstone-objective-2
  competency: troubleshooting
  description: Submit under contention and diagnose its wait.
- id: 12-capstone-objective-3
  competency: checkpointing
  description: Recover from an injected failure using a checkpoint.
- id: 12-capstone-objective-4
  competency: accounting
  description: Produce an accounting and efficiency summary.
steps:
- id: step-0
  instruction: Submit a robust training script
  evidence:
  - Follow the script's named `train-h200` baseline through `COMPLETED` before injecting a separate failure.
  critical: true
- id: step-1
  instruction: Monitor and explain its queue state
  evidence:
  - Use contention and state transitions to decide when intervention is unnecessary.
  critical: false
- id: step-2
  instruction: Launch the controlled failure attempt
  evidence:
  - The intentionally constrained request should create a separate learner job for diagnosis.
  critical: false
- id: step-3
  instruction: Observe the out-of-memory failure
  evidence:
  - Wait for the controlled attempt to reach an out-of-memory terminal state before correcting it.
  critical: true
- id: step-4
  instruction: Complete the corrected recovery
  evidence:
  - Complete a 1-GPU, 8-CPU, 64-GiB, 30-minute recovery after the controlled failure using the latest readable checkpoint.
  critical: true
- id: step-5
  instruction: Produce final accounting evidence
  evidence:
  - Summarize original, failure, and recovery terminal states with elapsed time.
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
  minimum_points_percent: 80
