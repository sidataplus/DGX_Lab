- id: step-2
  instruction: Submit under contention and diagnose its wait.
  evidence:
  - command transcript
  - resulting simulator state
  critical: false
- id: step-3
  instruction: Recover from an injected failure using a checkpoint.
  evidence:
  - command transcript
  - resulting simulator state
  critical: true
- id: step-4
  instruction: Produce an accounting and efficiency summary.
  evidence:
  - command transcript
  - resulting simulator state
  critical: true
hints:
- level: 1
  text: Inspect state before guessing.
- level: 2
  text: Use a read-only scheduler command that exposes the relevant object.
- level: 3
  text: Review the command reference card for this module.
completion:
  require_all_critical: true
